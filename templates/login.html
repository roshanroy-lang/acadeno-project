
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
<style>
  body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #74ebd5, #ACB6E5);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.loginform {
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 6px 12px rgba(0,0,0,0.15);
  max-width: 400px;
  width: 100%;
  text-align: center;
}

.loginform h2 {
  margin-bottom: 20px;
  color: #333;
  font-size: 24px;
}

.loginform label {
  display: block;
  text-align: left;
  margin-bottom: 8px;
  font-weight: bold;
  color: #444;
}

.loginform input {
  width: 100%;
  padding: 12px;
  margin-bottom: 18px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
  transition: border-color 0.3s;
}

.loginform input:focus {
  border-color: #74ebd5;
  outline: none;
}

.loginform button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #74ebd5, #ACB6E5);
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, background 0.3s;
}

.loginform button:hover {
  transform: scale(1.05);
  background: linear-gradient(135deg, #ACB6E5, #74ebd5);
}

.loginform p {
  margin-top: 15px;
  font-size: 14px;
}

.loginform a {
  color: #007bff;
  text-decoration: none;
}

.loginform a:hover {
  text-decoration: underline;
}

</style>

</head>

<body>
  <div class="loginform"> 
    <h2>Login</h2>
    <form action="/login/" method="post">
      {% csrf_token %}
      <label for="username">Username:</label><br>
      <input type="text" id="username" name="username" required><br><br><br>

      <label for="password">Password:</label><br>
      <input type="password" id="password" name="password" required><br><br>

      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="/register/">Sign up</a></p>
  </div>
</body>
</html>
