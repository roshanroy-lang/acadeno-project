<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #74ebd5, #ACB6E5);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.update-container {
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 6px 12px rgba(0,0,0,0.15);
  max-width: 400px;
  width: 100%;
  text-align: center;
}

.update-container label {
  display: block;
  text-align: left;
  margin-bottom: 8px;
  font-weight: bold;
  color: #444;
}

.update-container input {
  width: 100%;
  padding: 12px;
  margin-bottom: 18px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
  transition: border-color 0.3s;
}

.update-container input:focus {
  border-color: #74ebd5;
  outline: none;
}

.update-container button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #74ebd5, #ACB6E5);
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, background 0.3s;
}

.update-container button:hover {
  transform: scale(1.05);
  background: linear-gradient(135deg, #ACB6E5, #74ebd5);
}
</style>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <label >Update Task</label>
        <input type="text" name='title' value="{{ todo.task }}">
        <button type="submit">update </button>

    </form>
</body>
</html>
